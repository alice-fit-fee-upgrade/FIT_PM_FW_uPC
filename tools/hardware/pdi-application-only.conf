# Explicit 128 KiB application-only view; includes trailing erased pages.
# JTAG3 PDI uses application page erase, never boot/chip erase.
part parent "x128a3u"
 id = "pm12_full_app";
 desc = "PM12 ATxmega128A3U bounded application view";
 memory "app_full"
  size = 0x20000;
  offset = 0x800000;
  page_size = 0x200;
  readsize = 0x100;
 ;
;
